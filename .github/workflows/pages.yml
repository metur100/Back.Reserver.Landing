name: Deploy landing page to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check internal links and assets
        run: |
          set -e
          for f in *.html; do
            grep -oE '(src|href)="[^"#:]+"' "$f" | sed -E 's/^(src|href)="//; s/"$//' | while read -r ref; do
              case "$ref" in /*|./) continue ;; esac
              [ -e "$ref" ] || { echo "Missing file referenced in $f: $ref"; exit 1; }
            done
          done
      - name: Prepare site
        run: |
          mkdir _site
          cp -r index.html impressum.html datenschutz.html konto-loeschen.html support.html 404.html assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
